[project]
name = "bindi"
version = "0.2.0"
description = "Generate and curate protein binders via the hosted Boltz design API."
readme = "README.md"
requires-python = ">=3.11"  # tomllib (stdlib) for cited TOML data files
license = "MIT"
authors = [{ name = "wetware", email = "hellowetware@gmail.com" }]
keywords = ["protein", "binder", "Boltz", "de novo design"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "biopython>=1.83",
  "gemmi>=0.6.5",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/wetwarehq/bindi"
Repository = "https://github.com/wetwarehq/bindi"

[project.scripts]
bindi = "bindi.cli:main"
bd01 = "bindi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already carries src/bindi/data (the cited TOML data files) into the wheel.
# A force-include of the same directory made hatchling add every data file twice and the
# wheel build aborted ("A second file is being added to the wheel archive at the same
# path"), which broke `pip install .` -- the exact install the container does. Editable
# installs mask it, which is why the test suite never saw it.
packages = ["src/bindi"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/campaigns",
  "/fixtures",
  "/schemas",
  "/evidence",
  "/AGENT.md",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
